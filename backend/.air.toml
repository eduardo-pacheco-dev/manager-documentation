root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server.exe ./cmd/server"
bin = "./tmp/server.exe"
include_ext = ["go", "md", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "data", "node_modules", ".git"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "blue"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
