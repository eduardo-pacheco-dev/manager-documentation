# /etc/nginx/sites-available/afldoc.com.br
#
# Configuração final com HTTPS para o Documentation Center.
# Requer o certificado Let's Encrypt em /etc/letsencrypt/live/afldoc.com.br/.
# O backend deve estar ouvindo em 127.0.0.1:8080.

server {
    listen 80;
    listen [::]:80;
    server_name afldoc.com.br www.afldoc.com.br;

    # Renovação do certificado via webroot (certbot renew).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://afldoc.com.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afldoc.com.br;

    ssl_certificate     /etc/letsencrypt/live/afldoc.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afldoc.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Anexos do Nokia chegam a 40 MB; margem para o multipart.
    client_max_body_size 50m;
    client_body_timeout 300s;

    access_log /var/log/nginx/afldoc.access.log;
    error_log  /var/log/nginx/afldoc.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.afldoc.com.br;

    ssl_certificate     /etc/letsencrypt/live/afldoc.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afldoc.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://afldoc.com.br$request_uri;
}
