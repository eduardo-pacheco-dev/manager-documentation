# /etc/nginx/sites-available/afldoc.com.br
#
# Configuração TEMPORÁRIA, sem HTTPS, usada apenas para:
#   1. validar o proxy reverso;
#   2. emitir o primeiro certificado Let's Encrypt via webroot.
#
# Depois da emissão do certificado, substitua por afldoc.com.br.conf.

server {
    listen 80;
    listen [::]:80;
    server_name afldoc.com.br www.afldoc.com.br;

    root /var/www/certbot;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }
}
