# Hot reload executando a partir da raiz do repositório:
#   air -c .air.toml
# Compila o backend e executa o binário com working directory em ./backend,
# para carregar backend/.env, data/, seeds e static corretamente.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -C backend -o ../tmp/server.exe ./cmd/server"
entrypoint = ["cmd", "/c", "run-backend.cmd"]
full_bin = ""
include_dir = ["backend"]
include_ext = ["go", "md", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "backend\\data", "backend\\tmp", "frontend", ".git", ".github"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[build.windows]
entrypoint = ["cmd", "/c", "run-backend.cmd"]

[log]
time = true

[misc]
clean_on_exit = true
